[package]
name = "kds_guard"
version = "0.1.0"
edition = "2021"
description = "BadUSB Detection via Keystroke Dynamics Analysis"
authors = ["KDS Guard Team"]

[dependencies]
# Keyboard event capture (cross-platform)
rdev = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CSV writing
csv = "1.3"

# Timestamp handling
chrono = { version = "0.4", features = ["serde"] }

# CLI arguments
clap = { version = "4", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Statistics computation
statrs = "0.17"

# Windows API (BlockInput + Toast Notification)
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser", "errhandlingapi"] }

[profile.release]
opt-level = 3
lto = true
strip = true
